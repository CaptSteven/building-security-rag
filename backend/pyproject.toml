[project]
name = "building-security-rag-backend"
version = "0.1.0"
description = "楼宇安保 RAG 后端 API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3", "pypdf>=5,<7"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/security_rag"]
